version: "3.9"

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: portfolio-mcp-server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/portfolio.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: portfolio-bot
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000
      # SOCKS5_PROXY не нужен внутри Docker — трафик идёт напрямую
      - SOCKS5_PROXY=
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
